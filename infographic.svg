<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="Poppins, Inter, 'Segoe UI', sans-serif">
<defs>
<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#8B6DFF"/>
  <stop offset="50%" stop-color="#6C4DFF"/>
  <stop offset="100%" stop-color="#A98CFF"/>
</linearGradient>
<linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#6C4DFF"/>
  <stop offset="100%" stop-color="#3F8CFF"/>
</linearGradient>
<linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#6C4DFF" stop-opacity="0.15"/>
  <stop offset="55%" stop-color="#6C4DFF" stop-opacity="0.65"/>
  <stop offset="100%" stop-color="#8B6DFF" stop-opacity="0.9"/>
</linearGradient>
<linearGradient id="connGradV" gradientUnits="userSpaceOnUse" x1="800" y1="589" x2="800" y2="354">
  <stop offset="0%" stop-color="#6C4DFF" stop-opacity="0.15"/>
  <stop offset="55%" stop-color="#6C4DFF" stop-opacity="0.65"/>
  <stop offset="100%" stop-color="#8B6DFF" stop-opacity="0.9"/>
</linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#6C4DFF" flood-opacity="0.14"/>
</filter>
<filter id="softSmall" x="-70%" y="-70%" width="240%" height="240%">
  <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#5B3FD6" flood-opacity="0.16"/>
</filter>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="16" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
@keyframes popIn { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
@keyframes lineFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulseGlow { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes hubFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.node { transform-box: fill-box; transform-origin: center; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
.conn { animation: lineFade 0.5s ease-out both; }
.hub-glow { transform-box: fill-box; transform-origin: center; animation: pulseGlow 3.5s ease-in-out infinite; }
.orbit-ring { transform-box: fill-box; transform-origin: center; animation: spinSlow 90s linear infinite; }
.hub-group { transform-box: fill-box; transform-origin: center; animation: hubFloat 4.5s ease-in-out infinite; }
</style>
